<!doctype html><html lang='pt-PT'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Perfil e segurança</title><link rel='stylesheet' href='css/variables.css'><link rel='stylesheet' href='css/base.css'><link rel='stylesheet' href='css/auth.css'></head><body><main class='auth-form-wrap'><form class='auth-form' id='passForm'><h2>Alterar password</h2><label>Nova password<input id='newPass' type='password' minlength='8' required></label><label>Confirmar password<input id='confirmPass' type='password' minlength='8' required></label><div id='message' class='auth-message'></div><button class='btn btn-dark btn-full'>Guardar nova password</button></form></main><script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script><script src='js/config.js'></script><script src='js/services/supabase.js'></script><script src='js/services/auth-service.js'></script><script>passForm.onsubmit=async e=>{e.preventDefault();if(newPass.value!==confirmPass.value){message.textContent='As passwords não coincidem.';return}try{await AuthService.updatePassword(newPass.value);message.textContent='Password alterada com sucesso.'}catch(err){message.textContent=err.message}}</script></body></html>
