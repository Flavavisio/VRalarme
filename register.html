<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Criar conta — Security Store</title><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/auth.css"></head><body><main class="auth-page"><section class="auth-art"><a class="logo" href="index.html"><span class="logo-mark">S</span>SECURITYSTORE</a><div><h1>Conta profissional ou particular.</h1><p>Registe-se para gerir encomendas, preços e favoritos.</p></div></section><section class="auth-form-wrap"><form class="auth-form" id="registerForm"><h2>Criar conta</h2><label>Nome<input id="fullName" required></label><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><div class="auth-message" id="message"></div><button class="btn btn-dark btn-full">Criar conta</button><div class="auth-links"><a href="login.html">Já tenho conta</a></div></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/services/supabase.js"></script><script src="js/services/auth-service.js"></script><script>registerForm.onsubmit=async e=>{e.preventDefault();message.textContent="A criar conta...";try{await AuthService.signUp(email.value,password.value,fullName.value);message.textContent="Conta criada. Confirme o email se necessário."}catch(err){message.textContent=err.message}}</script></body></html>
