<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Entrar — Security Store</title><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/auth.css"></head><body><main class="auth-page"><section class="auth-art"><a class="logo" href="index.html"><span class="logo-mark">S</span>SECURITYSTORE</a><div><span class="eyebrow light">ÁREA RESERVADA</span><h1>A sua segurança começa aqui.</h1><p>Aceda às encomendas, preços profissionais, favoritos e listas de material.</p></div></section><section class="auth-form-wrap"><form class="auth-form" id="loginForm"><span class="eyebrow">BEM-VINDO</span><h2>Entrar</h2><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><div class="auth-message" id="message"></div><button class="btn btn-dark btn-full">Entrar</button><div class="auth-links"><a href="register.html">Criar conta</a></div></form></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/services/supabase.js"></script><script src="js/services/auth-service.js"></script><script>loginForm.onsubmit=async e=>{e.preventDefault();message.textContent="A entrar...";try{await AuthService.signIn(email.value,password.value);const p=await AuthService.profile();location.href=["super_admin","admin","sales","warehouse","marketing","finance"].includes(p?.role)?"admin/index.html":"cliente/index.html"}catch(err){message.textContent=err.message}}</script></body></html>
