<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fornecedores — Admin</title><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/admin.css"></head><body class="admin-body" data-roles="super_admin,admin,warehouse,finance"><div class="admin-layout"><aside class="admin-sidebar"></aside><main class="admin-main"><div class="admin-page-head"><div><span class="eyebrow">GESTÃO</span><h2>Fornecedores</h2><p>Contactos, prazos de entrega e fontes de catálogo.</p></div><a class="btn btn-dark" href="import-supplier.html"><span data-admin-icon="upload"></span>Importar catálogo</a></div><section class="panel"><div class="panel-head"><input id="search" class="admin-search" placeholder="Pesquisar fornecedor, NIF, email ou contacto..."><b id="count"></b></div><div class="table-wrap"><table class="data-table"><thead><tr><th>FORNECEDOR</th><th>NIF</th><th>CONTACTO</th><th>EMAIL</th><th>TELEFONE</th><th>PRAZO MÉDIO</th><th>ESTADO</th></tr></thead><tbody id="rows"><tr><td colspan="7">A carregar...</td></tr></tbody></table></div><p id="error" style="color:#b42318"></p></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/icons.js"></script><script src="../js/admin-shell.js"></script><script src="../js/config.js"></script><script src="../js/services/supabase.js"></script><script src="../js/services/auth-service.js"></script><script src="../js/services/admin-service.js"></script><script src="../js/admin-guard.js"></script><script>let all=[];function draw(){const s=search.value.toLowerCase(),d=all.filter(x=>!s||[x.name,x.vat_number,x.contact_name,x.email,x.phone].some(v=>String(v||'').toLowerCase().includes(s)));count.textContent=d.length+' fornecedores';rows.innerHTML=d.map(x=>`<tr><td><b>${x.name}</b></td><td>${x.vat_number||'—'}</td><td>${x.contact_name||'—'}</td><td>${x.email||'—'}</td><td>${x.phone||'—'}</td><td>${x.average_lead_days!=null?x.average_lead_days+' dias':'—'}</td><td><span class="status ${x.is_active===false?'danger':''}">${x.is_active===false?'Inativo':'Ativo'}</span></td></tr>`).join('')||'<tr><td colspan="7">Sem fornecedores.</td></tr>'}search.oninput=draw;(async()=>{try{all=await AdminService.suppliers();draw()}catch(e){error.textContent=e.message}})();</script></body></html>
