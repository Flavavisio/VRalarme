<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fornecedor — Admin</title><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/admin.css"><style>.cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid label{font-size:11px;font-weight:800}.form-grid input,.form-grid textarea,.form-grid select{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px}.wide{grid-column:1/-1}.feed-state{padding:14px;border-radius:14px;background:#f5f7f9;margin-bottom:14px}.actions{display:flex;gap:10px;flex-wrap:wrap}.history td{vertical-align:top}@media(max-width:850px){.cols,.form-grid{grid-template-columns:1fr}}</style></head><body class="admin-body" data-roles="super_admin,admin"><div class="admin-layout"><aside class="admin-sidebar"></aside><main class="admin-main"><div class="admin-page-head"><div><span class="eyebrow">FORNECEDOR</span><h2 id="title">Novo fornecedor</h2><p>Dados comerciais, feed de catálogo e sincronizações.</p></div><a class="btn btn-ghost" href="suppliers.html">← Fornecedores</a></div><div class="cols"><section class="panel"><h3>Ficha do fornecedor</h3><form id="form" class="form-grid"><label>Nome<input id="name" required></label><label>NIF<input id="vat_number"></label><label>Contacto<input id="contact_name"></label><label>Email<input id="email" type="email"></label><label>Telefone<input id="phone"></label><label>Prazo médio (dias)<input id="lead_time_days" type="number" min="0"></label><label class="wide">Notas<textarea id="notes" rows="4"></textarea></label><label><input id="is_active" type="checkbox" checked> Fornecedor ativo</label><button class="btn btn-dark wide">Guardar fornecedor</button></form><p id="saveMsg"></p></section><section class="panel"><h3>Feed CSV</h3><div id="feedState" class="feed-state">Guarde primeiro o fornecedor.</div><form id="feedForm" style="display:none" class="form-grid"><label class="wide">URL HTTPS<input id="feed_url" type="url" placeholder="https://fornecedor.pt/catalogo.csv"></label><label>Separador<select id="feed_delimiter"><option value=";">;</option><option value=",">,</option><option value="\t">Tab</option></select></label><div></div><label><input id="updateCost" type="checkbox" checked> Atualizar custo</label><label><input id="updatePvp" type="checkbox" checked> Atualizar PVP</label><label><input id="updateStock" type="checkbox" checked> Atualizar stock</label><label><input id="updateImage" type="checkbox" checked> Atualizar imagem</label><div class="wide actions"><button type="button" id="configure" class="btn btn-ghost">Testar e mapear CSV</button><button class="btn btn-dark">Guardar configuração</button><button type="button" id="sync" class="btn btn-dark">Sincronizar agora</button></div></form><p id="feedMsg"></p></section></div><section class="panel" style="margin-top:16px"><div class="panel-head"><h3>Histórico de sincronizações</h3><b id="historyCount"></b></div><div class="table-wrap"><table class="data-table history"><thead><tr><th>DATA</th><th>ESTADO</th><th>LINHAS</th><th>CRIADOS</th><th>ATUALIZADOS</th><th>ERROS</th></tr></thead><tbody id="history"><tr><td colspan="6">Sem sincronizações.</td></tr></tbody></table></div></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/icons.js"></script><script src="../js/admin-shell.js"></script><script src="../js/config.js"></script><script src="../js/services/supabase.js"></script><script src="../js/services/auth-service.js"></script><script src="../js/services/admin-service.js"></script><script src="../js/admin-guard.js"></script><script>let id=new URLSearchParams(location.search).get('id'),current=null;const fields=['name','vat_number','contact_name','email','phone','lead_time_days','notes'];const fmt=x=>x?new Intl.DateTimeFormat('pt-PT',{dateStyle:'short',timeStyle:'short'}).format(new Date(x)):'—';async function load(){if(!id)return;try{const d=await AdminService.supplier(id);current=d.supplier;title.textContent=current.name;fields.forEach(k=>document.getElementById(k).value=current[k]??'');is_active.checked=current.is_active!==false;feedForm.style.display='grid';feed_url.value=current.feed_url||'';feed_delimiter.value=current.feed_delimiter||';';const o=current.feed_options||{};updateCost.checked=o.updateCost!==false;updatePvp.checked=o.updatePvp!==false;updateStock.checked=o.updateStock!==false;updateImage.checked=o.updateImage!==false;feedState.innerHTML=current.feed_url?`<b>Feed configurado</b><br><small>Última sincronização: ${fmt(current.last_sync_at)} · ${current.last_sync_status||'sem estado'}</small>`:'Ainda não existe feed configurado.';historyCount.textContent=d.history.length+' registos';history.innerHTML=d.history.map(h=>`<tr><td>${fmt(h.started_at)}</td><td><span class="status ${h.status==='error'?'danger':''}">${h.status}</span></td><td>${h.total_rows||0}</td><td>${h.created_products||0}</td><td>${h.updated_products||0}</td><td>${h.error_count||0}</td></tr>`).join('')||'<tr><td colspan="6">Sem sincronizações.</td></tr>'}catch(e){saveMsg.textContent=e.message}}form.onsubmit=async e=>{e.preventDefault();try{const v={};fields.forEach(k=>v[k]=document.getElementById(k).value.trim());v.is_active=is_active.checked;const s=await AdminService.saveSupplier(v,id);id=s.id;history.replaceState(null,'','supplier.html?id='+id);saveMsg.textContent='Fornecedor guardado.';await load()}catch(e){saveMsg.textContent=e.message}};feedForm.onsubmit=async e=>{e.preventDefault();try{if(!feed_url.value)throw new Error('Indique o URL do feed.');const mapping=current?.feed_mapping||{};await AdminService.saveSupplierFeed(id,feed_url.value,feed_delimiter.value,mapping,{updateCost:updateCost.checked,updatePvp:updatePvp.checked,updateStock:updateStock.checked,updateImage:updateImage.checked});feedMsg.textContent='Configuração guardada.';await load()}catch(e){feedMsg.textContent=e.message}};configure.onclick=()=>{if(!feed_url.value){feedMsg.textContent='Indique primeiro o URL do feed.';return}location.href='import-supplier.html?supplier='+encodeURIComponent(id)+'&url='+encodeURIComponent(feed_url.value)};sync.onclick=async()=>{try{sync.disabled=true;sync.textContent='A sincronizar...';feedMsg.textContent='A atualizar catálogo, preços, stock e imagens...';const d=await AdminService.syncSupplier(id);feedMsg.textContent=`Concluído: ${d.created} criados, ${d.updated} atualizados, ${d.errorCount} erros.`;await load()}catch(e){feedMsg.textContent='Erro: '+e.message}finally{sync.disabled=false;sync.textContent='Sincronizar agora'}};load();</script></body></html>
