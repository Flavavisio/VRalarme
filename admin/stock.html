<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Stock — Admin</title><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/admin.css"></head><body class="admin-body" data-roles="super_admin,admin,warehouse"><div class="admin-layout"><aside class="admin-sidebar"></aside><main class="admin-main"><div class="admin-page-head"><div><span class="eyebrow">OPERAÇÃO</span><h2>Stock</h2><p>Disponibilidade real por produto e alertas de reposição.</p></div><a class="btn btn-ghost" href="stock-movements.html"><span data-admin-icon="movements"></span>Movimentos</a></div><section class="panel"><div class="panel-head"><input id="search" class="admin-search" placeholder="Pesquisar referência, SKU, produto ou marca..."><b id="count"></b></div><div class="table-wrap"><table class="data-table"><thead><tr><th>PRODUTO</th><th>ARMAZÉM</th><th>FÍSICO</th><th>RESERVADO</th><th>DISPONÍVEL</th><th>MÍNIMO</th><th>ESTADO</th></tr></thead><tbody id="rows"><tr><td colspan="7">A carregar...</td></tr></tbody></table></div><p id="error" style="color:#b42318"></p></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/icons.js"></script><script src="../js/admin-shell.js"></script><script src="../js/config.js"></script><script src="../js/services/supabase.js"></script><script src="../js/services/auth-service.js"></script><script src="../js/services/admin-service.js"></script><script src="../js/admin-guard.js"></script><script>async function load(){try{const d=await AdminService.stock(search.value.trim());count.textContent=d.length+' referências';rows.innerHTML=d.map(x=>{const a=Number(x.quantity_on_hand)-Number(x.quantity_reserved),state=a<=0?['Sem stock','danger']:a<=Number(x.min_stock)?['Stock baixo','warn']:['Disponível',''];return `<tr><td><b>${x.products?.name||'—'}</b><br><small>${x.products?.manufacturer_ref||x.products?.sku||'—'} · ${x.products?.brands?.name||''}</small></td><td>${x.warehouse||'Principal'}</td><td>${x.quantity_on_hand}</td><td>${x.quantity_reserved}</td><td><b>${a}</b></td><td>${x.min_stock}</td><td><span class="status ${state[1]}">${state[0]}</span></td></tr>`}).join('')||'<tr><td colspan="7">Sem registos de stock.</td></tr>'}catch(e){error.textContent=e.message}}let t;search.oninput=()=>{clearTimeout(t);t=setTimeout(load,180)};load();</script></body></html>
