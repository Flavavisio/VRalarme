<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Movimentos de Stock — Admin</title><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/admin.css"></head><body class="admin-body" data-roles="super_admin,admin,warehouse"><div class="admin-layout"><aside class="admin-sidebar"></aside><main class="admin-main"><div class="admin-page-head"><div><span class="eyebrow">OPERAÇÃO</span><h2>Movimentos de stock</h2><p>Histórico auditável de entradas, saídas, vendas, reservas, devoluções e correções.</p></div><a class="btn btn-ghost" href="stock.html">Voltar ao stock</a></div><section class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>DATA</th><th>PRODUTO</th><th>TIPO</th><th>QUANTIDADE</th><th>UTILIZADOR</th><th>OBSERVAÇÃO</th></tr></thead><tbody id="rows"><tr><td colspan="6">A carregar...</td></tr></tbody></table></div><p id="error" style="color:#b42318"></p></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/icons.js"></script><script src="../js/admin-shell.js"></script><script src="../js/config.js"></script><script src="../js/services/supabase.js"></script><script src="../js/services/auth-service.js"></script><script src="../js/services/admin-service.js"></script><script src="../js/admin-guard.js"></script><script>const date=x=>new Intl.DateTimeFormat('pt-PT',{dateStyle:'short',timeStyle:'short'}).format(new Date(x));(async()=>{try{const d=await AdminService.stockMovements();rows.innerHTML=d.map(x=>`<tr><td>${date(x.created_at)}</td><td><b>${x.products?.name||'—'}</b><br><small>${x.products?.manufacturer_ref||x.products?.sku||''}</small></td><td><span class="status">${x.movement_type}</span></td><td><b>${Number(x.quantity)>0?'+':''}${x.quantity}</b></td><td>${x.profiles?.full_name||'Sistema'}</td><td>${x.note||'—'}</td></tr>`).join('')||'<tr><td colspan="6">Ainda não existem movimentos.</td></tr>'}catch(e){error.textContent=e.message}})();</script></body></html>
