<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Encomendas — Admin</title><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/admin.css"></head><body class="admin-body" data-roles="super_admin,admin,sales,warehouse,finance"><div class="admin-layout"><aside class="admin-sidebar"></aside><main class="admin-main"><div class="admin-page-head"><div><span class="eyebrow">VENDAS</span><h2>Encomendas</h2><p>Pagamento, preparação e expedição num único ecrã.</p></div></div><section class="panel"><div class="panel-head"><input id="search" class="admin-search" placeholder="Pesquisar encomenda, cliente ou email..."><b id="count"></b></div><div class="table-wrap"><table class="data-table"><thead><tr><th>ENCOMENDA</th><th>CLIENTE</th><th>DATA</th><th>PAGAMENTO</th><th>TOTAL</th><th>ESTADO</th></tr></thead><tbody id="rows"><tr><td colspan="6">A carregar...</td></tr></tbody></table></div><p id="error" style="color:#b42318"></p></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/icons.js"></script><script src="../js/admin-shell.js"></script><script src="../js/config.js"></script><script src="../js/services/supabase.js"></script><script src="../js/services/auth-service.js"></script><script src="../js/services/admin-service.js"></script><script src="../js/admin-guard.js"></script><script>const eur=n=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(Number(n||0)),date=x=>new Intl.DateTimeFormat('pt-PT').format(new Date(x));let all=[];function draw(){const s=search.value.toLowerCase(),d=all.filter(o=>!s||[o.order_number,o.customers?.company_name,o.customers?.contact_name,o.customers?.email].some(v=>String(v||'').toLowerCase().includes(s)));count.textContent=d.length+' encomendas';rows.innerHTML=d.map(o=>`<tr><td><a href="order-detail.html?id=${o.id}"><b>${o.order_number||'—'}</b></a></td><td>${o.customers?.company_name||o.customers?.contact_name||'—'}<br><small>${o.customers?.email||''}</small></td><td>${date(o.created_at)}</td><td><span class="status ${o.payment_status==='paid'?'':'warn'}">${o.payment_status||'—'}</span><br><small>${o.payment_method||''}</small></td><td><b>${eur(o.grand_total)}</b></td><td><span class="status">${o.status||'—'}</span></td></tr>`).join('')||'<tr><td colspan="6">Sem encomendas.</td></tr>'}search.oninput=draw;(async()=>{try{all=await AdminService.orders();draw()}catch(e){error.textContent=e.message}})();</script></body></html>
