<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Preços — Admin</title><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/admin.css"></head><body class="admin-body" data-roles="super_admin,admin,finance"><div class="admin-layout"><aside class="admin-sidebar"></aside><main class="admin-main"><div class="admin-page-head"><div><span class="eyebrow">COMERCIAL</span><h2>Tabelas de preços</h2><p>Grupos comerciais e descontos base aplicados aos clientes.</p></div></div><section id="cards" class="kpi-grid"><div class="kpi"><span>A CARREGAR</span><b>—</b></div></section><section class="panel"><div class="panel-head"><h3>Grupos de clientes</h3><b id="count"></b></div><div class="table-wrap"><table class="data-table"><thead><tr><th>GRUPO</th><th>CÓDIGO</th><th>DESCONTO BASE</th><th>ESTADO</th></tr></thead><tbody id="rows"></tbody></table></div><p id="error" style="color:#b42318"></p></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/icons.js"></script><script src="../js/admin-shell.js"></script><script src="../js/config.js"></script><script src="../js/services/supabase.js"></script><script src="../js/services/auth-service.js"></script><script src="../js/services/admin-service.js"></script><script src="../js/admin-guard.js"></script><script>(async()=>{try{const d=await AdminService.priceGroups();count.textContent=d.length+' grupos';cards.innerHTML=d.slice(0,6).map(x=>`<div class="kpi"><span>${x.name}</span><b>${Number(x.default_discount_percent||0)?'-'+Number(x.default_discount_percent).toFixed(1)+'%':'Base'}</b></div>`).join('')||'<div class="kpi"><span>SEM GRUPOS</span><b>—</b></div>';rows.innerHTML=d.map(x=>`<tr><td><b>${x.name}</b></td><td>${x.code||'—'}</td><td>${Number(x.default_discount_percent||0).toFixed(2)}%</td><td><span class="status ${x.is_active===false?'danger':''}">${x.is_active===false?'Inativo':'Ativo'}</span></td></tr>`).join('')||'<tr><td colspan="4">Sem grupos configurados.</td></tr>'}catch(e){error.textContent=e.message}})();</script></body></html>
