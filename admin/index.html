<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin — Security Store</title><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/admin.css"></head><body class="admin-body" data-roles="super_admin,admin,sales,warehouse,marketing,finance"><div class="admin-layout"><aside class="admin-sidebar"></aside><main class="admin-main"><header class="admin-top"><div><span class="eyebrow">BACKOFFICE</span><h1>Dashboard</h1><p>Visão rápida da operação da loja.</p></div><div class="admin-actions quick-actions"><a class="btn btn-ghost" href="import-supplier.html"><span data-admin-icon="upload"></span>Importar fornecedor</a><a class="btn btn-dark" href="product-edit.html"><span data-admin-icon="plus"></span>Novo produto</a></div></header><section class="kpi-grid"><div class="kpi"><span>VENDAS HOJE</span><b id="today">—</b></div><div class="kpi"><span>VENDAS ESTE MÊS</span><b id="month">—</b></div><div class="kpi"><span>ENCOMENDAS</span><b id="orders">—</b></div><div class="kpi"><span>PRODUTOS</span><b id="products">—</b></div></section><div class="admin-grid"><section class="panel"><div class="panel-head"><h3>Últimas encomendas</h3><a href="orders.html">Ver todas →</a></div><div class="table-wrap"><table class="data-table"><thead><tr><th>ENCOMENDA</th><th>CLIENTE</th><th>TOTAL</th><th>ESTADO</th></tr></thead><tbody id="recent"><tr><td colspan="4">A carregar...</td></tr></tbody></table></div></section><section class="panel"><div class="panel-head"><h3>Atenção necessária</h3></div><div class="alert red"><span data-admin-icon="stock"></span><div><b id="out">—</b><small>Produtos sem stock</small></div></div><div class="alert"><span data-admin-icon="stock"></span><div><b id="low">—</b><small>Stock baixo</small></div></div><div class="alert green"><span data-admin-icon="users"></span><div><b id="customers">—</b><small>Clientes registados</small></div></div></section></div><p id="dashError" style="color:#b42318"></p></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/icons.js"></script><script src="../js/admin-shell.js"></script><script src="../js/config.js"></script><script src="../js/services/supabase.js"></script><script src="../js/services/auth-service.js"></script><script src="../js/services/admin-service.js"></script><script src="../js/admin-guard.js"></script><script>const eur=n=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(Number(n||0));window.addEventListener('load',async()=>{try{const d=await AdminService.dashboard();today.textContent=eur(d.salesToday);month.textContent=eur(d.salesMonth);orders.textContent=d.orders;products.textContent=d.products;customers.textContent=d.customers;out.textContent=d.outOfStock;low.textContent=d.lowStock;recent.innerHTML=d.recent.map(o=>`<tr><td><b>${o.order_number||'—'}</b></td><td>${o.customers?.company_name||o.customers?.contact_name||'—'}</td><td><b>${eur(o.grand_total)}</b></td><td><span class="status">${o.status}</span></td></tr>`).join('')||'<tr><td colspan="4">Sem encomendas.</td></tr>'}catch(e){dashError.textContent='Erro ao carregar dashboard: '+e.message}});</script></body></html>
