<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfis e permissões — Admin</title><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/admin.css"></head><body class="admin-body" data-roles="super_admin,admin"><div class="admin-layout"><aside class="admin-sidebar"></aside><main class="admin-main"><div class="admin-page-head"><div><span class="eyebrow">SEGURANÇA</span><h2>Perfis e permissões</h2><p>Matriz real de acessos configurada na base de dados.</p></div></div><section class="panel"><div class="panel-head"><h3>Permissões por perfil</h3><b id="summary"></b></div><div class="table-wrap"><table class="data-table"><thead id="head"></thead><tbody id="rows"><tr><td>A carregar...</td></tr></tbody></table></div><p id="error" style="color:#b42318"></p></section><section class="panel"><div class="panel-head"><h3>Utilizadores internos</h3></div><div class="table-wrap"><table class="data-table"><thead><tr><th>NOME</th><th>EMAIL</th><th>PERFIL</th><th>ESTADO</th></tr></thead><tbody id="users"></tbody></table></div></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/icons.js"></script><script src="../js/admin-shell.js"></script><script src="../js/config.js"></script><script src="../js/services/supabase.js"></script><script src="../js/services/auth-service.js"></script><script src="../js/services/admin-service.js"></script><script src="../js/admin-guard.js"></script><script>(async()=>{try{const[m,u]=await Promise.all([AdminService.rolesMatrix(),AdminService.profiles()]),mods=[...new Set(m.permissions.map(p=>p.module||'Geral'))],links=new Set(m.links.map(x=>x.role_id+'|'+x.permission_id));summary.textContent=m.roles.length+' perfis · '+m.permissions.length+' permissões';head.innerHTML='<tr><th>PERFIL</th>'+mods.map(x=>`<th>${x.toUpperCase()}</th>`).join('')+'</tr>';rows.innerHTML=m.roles.map(r=>`<tr><td><b>${r.name}</b><br><small>${r.code}</small></td>${mods.map(mod=>{const ps=m.permissions.filter(p=>(p.module||'Geral')===mod),n=ps.filter(p=>links.has(r.id+'|'+p.id)).length;return `<td>${n?`<span class="status">${n}/${ps.length}</span>`:'—'}</td>`}).join('')}</tr>`).join('')||'<tr><td>Sem perfis.</td></tr>';users.innerHTML=u.map(x=>`<tr><td><b>${x.full_name||'—'}</b></td><td>${x.email}</td><td>${x.roles?.name||'Sem perfil'}</td><td><span class="status ${x.is_active===false?'danger':''}">${x.is_active===false?'Inativo':'Ativo'}</span></td></tr>`).join('')||'<tr><td colspan="4">Sem utilizadores.</td></tr>'}catch(e){error.textContent=e.message}})();</script></body></html>
