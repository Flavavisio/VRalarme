<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produtos — Admin</title><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/admin.css"></head><body class="admin-body" data-roles="super_admin,admin,sales,warehouse"><div class="admin-layout"><aside class="admin-sidebar"></aside><main class="admin-main"><div class="admin-page-head"><div><span class="eyebrow">CATÁLOGO</span><h2>Produtos</h2><p>Pesquisa, preço, stock e edição rápida do catálogo.</p></div><div class="quick-actions"><a class="btn btn-ghost" href="import-supplier.html"><span data-admin-icon="upload"></span>Importar CSV</a><a class="btn btn-dark" href="product-edit.html"><span data-admin-icon="plus"></span>Novo produto</a></div></div><section class="panel"><div class="panel-head"><input id="search" class="admin-search" placeholder="Pesquisar SKU, referência, EAN ou nome..."><span id="count">A carregar...</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>PRODUTO</th><th>REFERÊNCIA</th><th>MARCA</th><th>PREÇO</th><th>DISPONÍVEL</th><th>ESTADO</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><p id="error" style="color:#b42318"></p></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/icons.js"></script><script src="../js/admin-shell.js"></script><script src="../js/config.js"></script><script src="../js/services/supabase.js"></script><script src="../js/services/auth-service.js"></script><script src="../js/services/admin-service.js"></script><script src="../js/admin-guard.js"></script><script>const euro=n=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(Number(n||0));async function load(){try{const data=await AdminService.products(search.value.trim());count.textContent=data.length+' produtos';rows.innerHTML=data.map(p=>{const pr=p.product_prices?.[0]||{},st=p.stock?.[0]||{},avail=Number(st.quantity_on_hand||0)-Number(st.quantity_reserved||0),price=pr.fixed_sale_price||0;return `<tr><td><b>${p.name}</b><br><small>${p.sku}</small></td><td>${p.manufacturer_ref||'—'}</td><td>${p.brands?.name||'—'}</td><td><b>${euro(price)}</b></td><td>${avail}</td><td><span class="status ${p.is_active?'':'danger'}">${p.is_active?'Ativo':'Inativo'}</span></td><td><a href="product-edit.html?id=${p.id}" aria-label="Editar">${AppIcons.svg('edit',17)}</a></td></tr>`}).join('')||'<tr><td colspan="7">Ainda não existem produtos.</td></tr>'}catch(e){error.textContent=e.message}}let t;search.oninput=()=>{clearTimeout(t);t=setTimeout(load,220)};window.addEventListener('load',load);</script></body></html>
