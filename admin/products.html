<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produtos — Admin</title><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/admin.css"></head><body class="admin-body" data-roles="super_admin,admin,sales,warehouse"><div class="admin-layout"><aside class="admin-sidebar"><a class="logo" href="index.html"><span class="logo-mark">S</span>SECURITYSTORE</a><nav class="admin-nav"><a href="index.html">▦ Dashboard</a><a class="active" href="products.html">◫ Produtos</a><a href="prices.html">€ Preços</a><a href="stock.html">▤ Stock</a><a href="suppliers.html">Fornecedores</a></nav></aside><main class="admin-main"><div class="admin-page-head"><div><span class="eyebrow">CATÁLOGO</span><h2>Produtos</h2></div><a class="btn btn-dark" href="product-edit.html">+ Novo produto</a></div><section class="panel"><div class="panel-head"><input id="search" class="admin-search" placeholder="SKU, referência, EAN ou nome..."><span id="count">A carregar...</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>PRODUTO</th><th>REFERÊNCIA</th><th>MARCA</th><th>PREÇO</th><th>DISPONÍVEL</th><th>ESTADO</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><p id="error" style="color:#b42318"></p></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/services/supabase.js"></script><script src="../js/services/auth-service.js"></script><script src="../js/services/admin-service.js"></script><script src="../js/admin-guard.js"></script><script>const euro=n=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(Number(n||0));async function load(){try{const data=await AdminService.products(search.value.trim());count.textContent=data.length+' produtos';rows.innerHTML=data.map(p=>{const pr=p.product_prices?.[0]||{};const st=p.stock?.[0]||{};const avail=Number(st.quantity_on_hand||0)-Number(st.quantity_reserved||0);const price=pr.fixed_sale_price||0;return `<tr><td><b>${p.name}</b><br><small>${p.sku}</small></td><td>${p.manufacturer_ref||'—'}</td><td>${p.brands?.name||'—'}</td><td>${euro(price)}</td><td>${avail}</td><td><span class="status ${p.is_active?'':'danger'}">${p.is_active?'Ativo':'Inativo'}</span></td><td><a href="product-edit.html?id=${p.id}">Editar →</a></td></tr>`}).join('')||'<tr><td colspan="7">Ainda não existem produtos.</td></tr>'}catch(e){error.textContent=e.message}}let t;search.oninput=()=>{clearTimeout(t);t=setTimeout(load,250)};window.addEventListener('load',load);</script></body></html>
