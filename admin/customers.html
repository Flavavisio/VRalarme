<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clientes — Admin</title><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/admin.css"></head><body class="admin-body" data-roles="super_admin,admin,sales,finance"><div class="admin-layout"><aside class="admin-sidebar"></aside><main class="admin-main"><div class="admin-page-head"><div><span class="eyebrow">VENDAS</span><h2>Clientes</h2><p>Contas, grupos comerciais, desconto e crédito.</p></div></div><section class="panel"><div class="panel-head"><input id="search" class="admin-search" placeholder="Pesquisar empresa, nome, NIF, email ou telefone..."><b id="count"></b></div><div class="table-wrap"><table class="data-table"><thead><tr><th>CLIENTE</th><th>NIF</th><th>GRUPO</th><th>DESCONTO</th><th>CRÉDITO</th><th>CONTACTO</th><th>ESTADO</th></tr></thead><tbody id="rows"><tr><td colspan="7">A carregar...</td></tr></tbody></table></div><p id="error" style="color:#b42318"></p></section></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/icons.js"></script><script src="../js/admin-shell.js"></script><script src="../js/config.js"></script><script src="../js/services/supabase.js"></script><script src="../js/services/auth-service.js"></script><script src="../js/services/admin-service.js"></script><script src="../js/admin-guard.js"></script><script>const eur=n=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(Number(n||0));let all=[];function draw(){const s=search.value.toLowerCase(),d=all.filter(c=>!s||[c.company_name,c.contact_name,c.vat_number,c.email,c.phone].some(v=>String(v||'').toLowerCase().includes(s)));count.textContent=d.length+' clientes';rows.innerHTML=d.map(c=>`<tr><td><b>${c.company_name||c.contact_name||'—'}</b><br><small>${c.email||''}</small></td><td>${c.vat_number||'—'}</td><td>${c.customer_groups?.name||'PVP'}</td><td>${Number(c.general_discount_percent||0).toFixed(1)}%</td><td>${eur(c.credit_limit)}</td><td>${c.phone||'—'}</td><td><span class="status ${String(c.status).toLowerCase()==='active'?'':'warn'}">${c.status||'Ativo'}</span></td></tr>`).join('')||'<tr><td colspan="7">Sem clientes.</td></tr>'}search.oninput=draw;(async()=>{try{all=await AdminService.customers();draw()}catch(e){error.textContent=e.message}})();</script></body></html>
