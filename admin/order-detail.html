<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Encomenda — Admin</title><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/admin.css"></head><body class="admin-body" data-roles="super_admin,admin,sales,warehouse,finance"><div class="admin-layout"><aside class="admin-sidebar"></aside><main class="admin-main"><div class="admin-page-head"><div><span class="eyebrow">VENDAS</span><h2 id="title">Encomenda</h2><p id="customer">A carregar...</p></div><a class="btn btn-ghost" href="orders.html">← Encomendas</a></div><section class="kpi-grid"><div class="kpi"><span>TOTAL</span><b id="total">—</b></div><div class="kpi"><span>PAGAMENTO</span><b id="payment">—</b></div><div class="kpi"><span>ESTADO</span><b id="status">—</b></div><div class="kpi"><span>DATA</span><b id="date">—</b></div></section><div class="detail-grid"><section class="panel"><div class="panel-head"><h3>Produtos</h3></div><div class="table-wrap"><table class="data-table"><thead><tr><th>PRODUTO</th><th>REFERÊNCIA</th><th>QTD.</th><th>UNITÁRIO</th><th>TOTAL</th></tr></thead><tbody id="items"><tr><td colspan="5">A carregar...</td></tr></tbody></table></div></section><aside class="panel"><div class="panel-head"><h3>Histórico</h3></div><div id="timeline">A carregar...</div></aside></div><p id="error" style="color:#b42318"></p></main></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/icons.js"></script><script src="../js/admin-shell.js"></script><script src="../js/config.js"></script><script src="../js/services/supabase.js"></script><script src="../js/services/auth-service.js"></script><script src="../js/services/admin-service.js"></script><script src="../js/admin-guard.js"></script><script>const eur=n=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(Number(n||0)),fmt=x=>x?new Intl.DateTimeFormat('pt-PT',{dateStyle:'short',timeStyle:'short'}).format(new Date(x)):'—';(async()=>{try{const id=new URLSearchParams(location.search).get('id');if(!id)throw new Error('Encomenda não indicada.');const d=await AdminService.orderDetail(id),o=d.order;title.textContent='Encomenda '+(o.order_number||'');customer.textContent=[o.customers?.company_name||o.customers?.contact_name,o.customers?.email].filter(Boolean).join(' · ')||'Cliente não identificado';total.textContent=eur(o.grand_total);payment.textContent=o.payment_status||'—';status.textContent=o.status||'—';date.textContent=fmt(o.created_at);items.innerHTML=(o.order_items||[]).map(i=>`<tr><td><b>${i.product_name||i.products?.name||'Produto'}</b></td><td>${i.sku||i.products?.sku||'—'}</td><td>${i.quantity||0}</td><td>${eur(i.unit_price)}</td><td><b>${eur(i.line_total??Number(i.quantity||0)*Number(i.unit_price||0))}</b></td></tr>`).join('')||'<tr><td colspan="5">Sem artigos.</td></tr>';timeline.innerHTML=(d.history||[]).map(h=>`<div class="timeline-item"><b>${h.status||'Atualização'}</b><small>${fmt(h.created_at)}${h.note?' · '+h.note:''}</small></div>`).join('')||'<p>Sem histórico registado.</p>'}catch(e){error.textContent='Erro ao carregar encomenda: '+e.message}})();</script></body></html>
