<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produto — Admin</title><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/admin.css"><style>.form-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.field{display:flex;flex-direction:column;gap:7px}.field.wide{grid-column:span 2}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:800;color:#667085}.field input,.field select,.field textarea{padding:12px 13px;border:1px solid var(--border);border-radius:10px;background:#fff}.switches{display:flex;gap:18px;flex-wrap:wrap}.price-preview{padding:18px;border-radius:14px;background:#f6f8fb;display:flex;justify-content:space-between;align-items:center}.price-preview b{font-size:26px}.savebar{position:sticky;bottom:12px;z-index:5;display:flex;justify-content:flex-end;gap:10px;padding:12px;background:rgba(255,255,255,.92);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:14px;margin-top:16px}@media(max-width:850px){.form-grid{grid-template-columns:1fr}.field.wide{grid-column:auto}}</style></head><body class="admin-body" data-roles="super_admin,admin"><main class="admin-main"><div class="admin-page-head"><div><span class="eyebrow">CATÁLOGO</span><h2 id="title">Novo produto</h2></div><a class="btn btn-ghost" href="products.html">← Produtos</a></div><form id="form"><section class="panel"><h3>Informação geral</h3><div class="form-grid"><div class="field"><label>SKU *</label><input name="sku" required></div><div class="field"><label>Referência fabricante</label><input name="manufacturer_ref"></div><div class="field"><label>EAN</label><input name="ean"></div><div class="field wide"><label>Nome *</label><input name="name" required></div><div class="field"><label>Marca</label><select name="brand_id"><option value="">—</option></select></div><div class="field"><label>Categoria</label><select name="category_id"><option value="">—</option></select></div><div class="field"><label>Fornecedor principal</label><select name="primary_supplier_id"><option value="">—</option></select></div><div class="field full"><label>Descrição curta</label><textarea name="short_description" rows="2"></textarea></div><div class="field full"><label>Descrição completa</label><textarea name="full_description" rows="5"></textarea></div></div></section><section class="panel" style="margin-top:14px"><h3>Preço, margem e stock</h3><div class="form-grid"><div class="field"><label>Custo fornecedor (€)</label><input name="cost_price" type="number" min="0" step="0.01"></div><div class="field"><label>PVP recebido do fornecedor (€)</label><input name="supplier_pvp" type="number" min="0" step="0.01"></div><div class="field"><label>Regra do preço de venda</label><select name="price_source"><option value="margin">Calcular pela minha margem</option><option value="supplier_pvp">Usar PVP do fornecedor</option></select></div><div class="field"><label>Margem pretendida (%)</label><input name="margin_percent" type="number" min="0" max="99.99" step="0.01" value="30"></div><div class="field"><label>Stock físico</label><input name="quantity_on_hand" type="number" min="0" step="1"></div><div class="field"><label>Stock mínimo</label><input name="min_stock" type="number" min="0" step="1"></div><div class="field full"><div class="price-preview"><span>PVP calculado <small id="formula"></small></span><b id="pvp">0,00 €</b></div></div></div></section><section class="panel" style="margin-top:14px"><h3>Imagem e publicação</h3><div class="form-grid"><div class="field full"><label>URL da imagem do produto</label><input name="image_url" type="url" placeholder="https://fornecedor.pt/imagens/produto.jpg"></div><div class="field full"><div class="switches"><label><input name="is_active" type="checkbox" checked> Ativo</label><label><input name="is_featured" type="checkbox"> Destaque</label><label><input name="is_new" type="checkbox"> Novo</label><label><input name="is_promo" type="checkbox"> Promoção</label></div></div></div></section><div class="savebar"><span id="msg" style="margin-right:auto"></span><button class="btn btn-dark" type="submit">Guardar produto</button></div></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/services/supabase.js"></script><script src="../js/services/auth-service.js"></script><script src="../js/services/admin-service.js"></script><script src="../js/admin-guard.js"></script><script>const id=new URLSearchParams(location.search).get('id'),f=document.querySelector('#form');const eur=n=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(Number(n||0));function calc(){const cost=+f.cost_price.value||0,m=+f.margin_percent.value||0,sp=+f.supplier_pvp.value||0,use=f.price_source.value==='supplier_pvp';const val=use?sp:(m<100?cost/(1-m/100):0);pvp.textContent=eur(val);formula.textContent=use?'· PVP fornecedor':`· custo ÷ (1 - ${m}% )`}f.oninput=calc;async function init(){const l=await AdminService.lookups();for(const [name,arr] of [['brand_id',l.brands],['category_id',l.categories],['primary_supplier_id',l.suppliers]]){f[name].innerHTML='<option value="">—</option>'+arr.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}if(id){title.textContent='Editar produto';const p=await AdminService.product(id),pr=p.product_prices?.[0]||{},st=p.stock?.[0]||{},im=(p.product_images||[]).find(x=>x.is_primary)||p.product_images?.[0]||{};const vals={...p,...pr,...st,image_url:im.url||'',supplier_pvp:pr.fixed_sale_price||'',price_source:pr.pricing_method==='supplier_pvp'?'supplier_pvp':'margin'};Object.entries(vals).forEach(([k,v])=>{if(f[k]&&v!=null){if(f[k].type==='checkbox')f[k].checked=!!v;else f[k].value=v}})}calc()}f.onsubmit=async e=>{e.preventDefault();msg.textContent='A guardar...';const v=Object.fromEntries(new FormData(f));['is_active','is_featured','is_new','is_promo'].forEach(k=>v[k]=f[k].checked);try{const p=await AdminService.saveProduct(v,id);msg.textContent='✓ Guardado';if(!id)location.href='product-edit.html?id='+p.id}catch(e){msg.textContent='Erro: '+e.message}};init().catch(e=>msg.textContent='Erro: '+e.message);</script></body></html>
