<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Importar fornecedor — Admin</title><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"><link rel="stylesheet" href="../css/admin.css"><style>.steps{display:flex;gap:8px;margin:16px 0 22px}.step{padding:8px 12px;border-radius:999px;background:#eef2f6;font-size:11px;font-weight:800}.step.on{background:#0b1626;color:white}.import-grid{display:grid;grid-template-columns:1fr 160px auto;gap:10px}.mapping{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mapping label{font-size:11px;font-weight:800}.mapping select,.import-grid input,.import-grid select{width:100%;padding:12px;border:1px solid var(--border);border-radius:10px}.preview{overflow:auto;max-height:420px}.preview table{white-space:nowrap}@media(max-width:800px){.import-grid,.mapping{grid-template-columns:1fr}}</style></head><body class="admin-body" data-roles="super_admin,admin"><main class="admin-main"><div class="admin-page-head"><div><span class="eyebrow">FORNECEDORES</span><h2>Importar catálogo CSV</h2><p>Atualiza custo, PVP, stock e imagens a partir do link do fornecedor.</p></div><a class="btn btn-ghost" href="suppliers.html">← Fornecedores</a></div><div class="steps"><span class="step on">1 · Fonte</span><span class="step">2 · Mapear</span><span class="step">3 · Preview</span><span class="step">4 · Importar</span></div><section class="panel"><h3>Link do catálogo</h3><div class="import-grid"><input id="url" type="url" placeholder="https://fornecedor.pt/catalogo.csv"><select id="delimiter"><option value=";">Separador ;</option><option value=",">Separador ,</option><option value="\t">Tab</option></select><button id="read" class="btn btn-dark">Ler CSV</button></div><p id="msg"></p></section><section id="mapPanel" class="panel" style="margin-top:14px;display:none"><div class="panel-head"><h3>Mapeamento</h3><small>Escolhe a coluna do fornecedor correspondente a cada campo.</small></div><div id="mapping" class="mapping"></div><div style="margin-top:16px"><label><input id="updateCost" type="checkbox" checked> Atualizar custo</label> &nbsp; <label><input id="updatePvp" type="checkbox" checked> Atualizar PVP fornecedor</label> &nbsp; <label><input id="updateStock" type="checkbox" checked> Atualizar stock</label> &nbsp; <label><input id="updateImage" type="checkbox" checked> Atualizar URL da imagem</label></div></section><section id="previewPanel" class="panel" style="margin-top:14px;display:none"><div class="panel-head"><h3>Preview</h3><b id="stats"></b></div><div class="preview"><table class="data-table"><thead id="head"></thead><tbody id="body"></tbody></table></div><div style="display:flex;justify-content:flex-end;margin-top:14px"><button id="confirm" class="btn btn-dark" disabled>Confirmar importação (próxima etapa)</button></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/services/supabase.js"></script><script src="../js/services/auth-service.js"></script><script src="../js/services/admin-service.js"></script><script src="../js/admin-guard.js"></script><script>let csv=null;const fields=[['sku','SKU / Código'],['manufacturer_ref','Referência fabricante'],['ean','EAN'],['name','Nome'],['cost_price','Custo'],['supplier_pvp','PVP'],['quantity_on_hand','Stock'],['image_url','URL imagem'],['brand','Marca'],['category','Categoria']];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function guess(field,headers){const words={sku:['sku','codigo','code','reference'],manufacturer_ref:['ref','referencia','manufacturer'],ean:['ean','barcode'],name:['nome','name','description'],cost_price:['custo','cost','purchase','net'],supplier_pvp:['pvp','rrp','retail','sale'],quantity_on_hand:['stock','qty','quantity'],image_url:['image','imagem','photo','picture','url'],brand:['brand','marca'],category:['category','categoria','family']}[field]||[];return headers.find(h=>words.some(w=>h.toLowerCase().includes(w)))||''}read.onclick=async()=>{msg.textContent='A descarregar e validar o CSV...';try{csv=await AdminService.previewSupplierCsv(url.value,delimiter.value==='\\t'?'\t':delimiter.value);msg.textContent=`✓ ${csv.totalRows} linhas encontradas`;mapPanel.style.display=previewPanel.style.display='block';mapping.innerHTML=fields.map(([k,l])=>`<label>${l}<select data-field="${k}"><option value="">Ignorar</option>${csv.headers.map(h=>`<option ${h===guess(k,csv.headers)?'selected':''} value="${esc(h)}">${esc(h)}</option>`).join('')}</select></label>`).join('');head.innerHTML='<tr>'+csv.headers.slice(0,8).map(h=>`<th>${esc(h)}</th>`).join('')+'</tr>';body.innerHTML=csv.rows.slice(0,20).map(r=>'<tr>'+csv.headers.slice(0,8).map(h=>`<td>${esc(r[h])}</td>`).join('')+'</tr>').join('');stats.textContent=`${csv.previewRows} em preview / ${csv.totalRows} total`;confirm.disabled=false}catch(e){msg.textContent='Erro: '+e.message}};confirm.onclick=()=>alert('Preview validado. A escrita em lote será ativada depois de guardar o perfil deste fornecedor, para não importar dados sem regras persistentes.');</script></body></html>
