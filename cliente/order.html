<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Detalhe da encomenda</title><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"><style>body{background:#f6f7f9}.wrap{max-width:1050px;margin:auto;padding:32px 20px}.panel{background:#fff;border:1px solid #e8eaed;border-radius:18px;padding:20px}.head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:20px}.items{width:100%;border-collapse:collapse}.items th,.items td{text-align:left;padding:14px 10px;border-bottom:1px solid #eee}.totals{margin-left:auto;max-width:360px;padding-top:20px}.totals div{display:flex;justify-content:space-between;padding:7px 0}.grand{font-size:20px;font-weight:800}@media(max-width:650px){.head{align-items:start;flex-direction:column}.items th:nth-child(2),.items td:nth-child(2){display:none}}</style></head><body><main class="wrap"><div class="head"><div><span class="eyebrow">ENCOMENDA</span><h1 id="title">A carregar...</h1><p id="meta"></p></div><a class="btn btn-ghost" href="index.html">← A minha conta</a></div><section class="panel"><table class="items"><thead><tr><th>Produto</th><th>Referência</th><th>Qtd.</th><th>Preço</th><th>Total</th></tr></thead><tbody id="rows"></tbody></table><div class="totals"><div><span>Subtotal</span><b id="subtotal"></b></div><div><span>Desconto</span><b id="discount"></b></div><div><span>IVA</span><b id="tax"></b></div><div><span>Portes</span><b id="shipping"></b></div><div class="grand"><span>Total</span><b id="total"></b></div></div><p id="error" style="color:#b42318"></p></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/services/supabase.js"></script><script src="../js/services/customer-service.js"></script><script>const eur=n=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(Number(n||0)),dt=x=>new Intl.DateTimeFormat('pt-PT',{dateStyle:'long'}).format(new Date(x));(async()=>{try{const id=new URLSearchParams(location.search).get('id');if(!id)throw new Error('Encomenda não indicada.');const o=await CustomerService.order(id);title.textContent=o.order_number||'Encomenda';meta.textContent=dt(o.created_at)+' · '+o.status+' · '+(o.payment_status||'');rows.innerHTML=(o.order_items||[]).map(i=>`<tr><td><b>${i.product_name||i.products?.name||'Produto'}</b></td><td>${i.product_sku||i.products?.manufacturer_ref||i.products?.sku||'—'}</td><td>${i.quantity}</td><td>${eur(i.unit_price)}</td><td><b>${eur(i.line_total)}</b></td></tr>`).join('')||'<tr><td colspan="5">Sem artigos.</td></tr>';subtotal.textContent=eur(o.subtotal);discount.textContent='-'+eur(o.discount_total);tax.textContent=eur(o.tax_total);shipping.textContent=eur(o.shipping_cost);total.textContent=eur(o.grand_total)}catch(e){error.textContent=e.message}})();</script></body></html>
