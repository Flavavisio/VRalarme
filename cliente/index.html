<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A minha conta</title><link rel="stylesheet" href="../css/variables.css"><link rel="stylesheet" href="../css/base.css"><link rel="stylesheet" href="../css/components.css"><style>body{background:#f6f7f9}.account{max-width:1180px;margin:auto;padding:32px 20px 80px}.account-head{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:24px}.account-head h1{margin:4px 0}.account-grid{display:grid;grid-template-columns:1.5fr .8fr;gap:20px}.account .panel{background:#fff;border:1px solid #e8eaed;border-radius:18px;padding:20px}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:20px 0}.summary div{background:#fff;border:1px solid #e8eaed;border-radius:16px;padding:18px}.summary b{font-size:24px;display:block;margin-top:5px}.order{display:grid;grid-template-columns:1fr 1fr auto;gap:12px;padding:15px 0;border-bottom:1px solid #eee;align-items:center}.address{padding:12px 0;border-bottom:1px solid #eee}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.form-grid input{width:100%;padding:12px;border:1px solid #dfe3e8;border-radius:12px}.wide{grid-column:1/-1}@media(max-width:800px){.account-grid,.summary,.form-grid{grid-template-columns:1fr}.order{grid-template-columns:1fr}.account-head{align-items:start;flex-direction:column}}</style></head><body><main class="account"><div class="account-head"><div><span class="eyebrow">ÁREA DE CLIENTE</span><h1 id="hello">A minha conta</h1><p id="group">Encomendas, dados e moradas num só lugar.</p></div><a class="btn btn-ghost" href="../index.html">Voltar à loja</a></div><section class="summary"><div><span>ENCOMENDAS</span><b id="norders">—</b></div><div><span>TOTAL COMPRADO</span><b id="spent">—</b></div><div><span>ÚLTIMA ENCOMENDA</span><b id="last">—</b></div></section><div class="account-grid"><section class="panel"><h2>Encomendas</h2><div id="orders">A carregar...</div></section><aside><section class="panel"><h2>Moradas</h2><div id="addresses">A carregar...</div></section><section class="panel" style="margin-top:20px"><h2>Dados pessoais</h2><form id="profile" class="form-grid"><input id="contact_name" placeholder="Nome"><input id="company_name" placeholder="Empresa"><input id="vat_number" placeholder="NIF"><input id="phone" placeholder="Telefone"><input id="address_line" class="wide" placeholder="Morada"><input id="postal_code" placeholder="Código postal"><input id="city" placeholder="Localidade"><button class="btn btn-dark wide">Guardar dados</button></form><p id="msg"></p></section><section class="panel" style="margin-top:20px"><h2>Segurança</h2><form id="password"><input id="newpass" type="password" minlength="8" placeholder="Nova password" style="width:100%;padding:12px;border:1px solid #dfe3e8;border-radius:12px;margin-bottom:10px"><button class="btn btn-ghost" style="width:100%">Alterar password</button></form><p id="passmsg"></p></section></aside></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../js/config.js"></script><script src="../js/services/supabase.js"></script><script src="../js/services/customer-service.js"></script><script>const eur=n=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(Number(n||0)),dt=x=>new Intl.DateTimeFormat('pt-PT').format(new Date(x));let current;async function load(){try{current=await CustomerService.dashboard();if(!current.customer){location.href='../login.html';return}const c=current.customer;hello.textContent='Olá, '+(c.contact_name||c.company_name||'Cliente');group.textContent=(c.customer_groups?.name?'Tabela '+c.customer_groups.name+' · ':'')+'Encomendas, dados e moradas num só lugar.';norders.textContent=current.orders.length;spent.textContent=eur(current.orders.filter(x=>!['cancelled','canceled'].includes(String(x.status).toLowerCase())).reduce((s,x)=>s+Number(x.grand_total||0),0));last.textContent=current.orders[0]?dt(current.orders[0].created_at):'—';orders.innerHTML=current.orders.map(o=>`<div class="order"><div><b>${o.order_number}</b><br><small>${dt(o.created_at)}</small></div><div><span class="status">${o.status}</span><br><small>${o.payment_status||''}</small></div><div><b>${eur(o.grand_total)}</b><br><a href="order.html?id=${o.id}">Ver detalhe →</a></div></div>`).join('')||'<p>Ainda não existem encomendas.</p>';addresses.innerHTML=current.addresses.map(a=>`<div class="address"><b>${a.label||a.type||'Morada'}</b>${a.is_default?' · Principal':''}<br><small>${a.contact_name||''}<br>${a.address_line||''}<br>${a.postal_code||''} ${a.city||''}</small></div>`).join('')||'<p>Sem moradas guardadas.</p>';['contact_name','company_name','vat_number','phone','address_line','postal_code','city'].forEach(k=>document.getElementById(k).value=c[k]||'')}catch(e){msg.textContent=e.message}}profile.onsubmit=async e=>{e.preventDefault();try{const v={};['contact_name','company_name','vat_number','phone','address_line','postal_code','city'].forEach(k=>v[k]=document.getElementById(k).value.trim());await CustomerService.saveProfile(v);msg.textContent='Dados atualizados.'}catch(x){msg.textContent=x.message}};password.onsubmit=async e=>{e.preventDefault();try{await CustomerService.changePassword(newpass.value);newpass.value='';passmsg.textContent='Password alterada com sucesso.'}catch(x){passmsg.textContent=x.message}};load();</script></body></html>
