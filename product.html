<!doctype html><html lang="pt-PT"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Produto — Security Store</title><link rel="stylesheet" href="css/variables.css"><link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/components.css"><link rel="stylesheet" href="css/product.css"><link rel="stylesheet" href="css/mobile.css"><style>.spec-table{width:100%;border-collapse:collapse}.spec-table td{padding:12px;border-bottom:1px solid #eee}.spec-table td:first-child{font-weight:700;width:35%}.detail-section{padding:28px 0}.product-empty{text-align:center;padding:80px 20px}.thumbs img,.main-product-image img{max-width:100%;max-height:100%;object-fit:contain}.doc-list a{display:block;padding:12px 0;border-bottom:1px solid #eee}</style></head><body><header class="simple-header shell"><a class="logo" href="index.html"><span class="logo-mark">S</span>SECURITYSTORE</a><a href="category.html" class="btn btn-ghost">Catálogo</a></header><main class="shell product-page" id="page"><div class="product-empty">A carregar produto...</div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="js/config.js"></script><script src="js/services/supabase.js"></script><script src="js/services/catalog-service.js"></script><script src="js/icons.js"></script><script>const euro=n=>new Intl.NumberFormat('pt-PT',{style:'currency',currency:'EUR'}).format(Number(n||0));(async()=>{const page=document.querySelector('#page');try{const id=new URLSearchParams(location.search).get('id');if(!id)throw new Error('Produto não indicado.');const p=await CatalogService.product(id),prices=[...(p.product_prices||[])].sort((a,b)=>String(b.updated_at||'').localeCompare(String(a.updated_at||''))),pp=prices[0]||{},price=pp.fixed_sale_price!=null?Number(pp.fixed_sale_price):Number(pp.cost_price||0)*(1+Number(pp.margin_percent||0)/100),available=(p.stock||[]).reduce((s,x)=>s+Number(x.quantity_on_hand||0)-Number(x.quantity_reserved||0),0),images=[...(p.product_images||[])].sort((a,b)=>(b.is_primary?1:0)-(a.is_primary?1:0)||(a.sort_order||0)-(b.sort_order||0)),main=images[0]?.storage_path,specs=p.product_specs||[],docs=p.product_documents||[];document.title=p.name+' — Security Store';page.innerHTML=`<div class="breadcrumbs"><a href="index.html">Home</a> / <a href="category.html?category=${encodeURIComponent(p.categories?.name||'')}">${p.categories?.name||'Produtos'}</a> / ${p.name}</div><section class="product-hero"><div class="gallery"><div class="thumbs">${images.map((x,i)=>`<button data-img="${x.storage_path}">${x.storage_path?`<img src="${x.storage_path}" alt="">`:'◉'}</button>`).join('')}</div><div class="main-product-image" id="mainImage">${main?`<img src="${main}" alt="${p.name}">`:AppIcons.category(p.categories?.name||p.name)}</div></div><div class="product-info"><span class="eyebrow">${p.brands?.name||''}</span><h1>${p.name}</h1><div class="ref">${p.manufacturer_ref||p.sku||''}</div><p>${p.short_description||''}</p><div class="big-price">${euro(price)} <small>+ IVA</small></div><div class="vat-price">${euro(price*1.23)} IVA incluído*</div><div class="stock-ok">${available>0?'● Em stock ('+available+')':'● Esgotado'}</div><div class="buy-row"><button class="btn btn-dark grow" id="add" ${available<=0?'disabled':''}>Adicionar ao carrinho</button></div><small>* IVA apresentado a 23%; o valor final é validado no checkout.</small></div></section><nav class="product-tabs"><a href="#description">Descrição</a><a href="#specs">Especificações</a><a href="#downloads">Downloads</a></nav><section class="detail-section" id="description"><h2>Descrição</h2><p>${p.full_description||p.short_description||'Sem descrição disponível.'}</p></section><section class="detail-section" id="specs"><h2>Especificações técnicas</h2>${specs.length?`<table class="spec-table">${specs.map(s=>`<tr><td>${s.spec_name||s.name||'Especificação'}</td><td>${s.spec_value||s.value||''}${s.unit?' '+s.unit:''}</td></tr>`).join('')}</table>`:'<p>Sem especificações técnicas registadas.</p>'}</section><section class="detail-section" id="downloads"><h2>Downloads</h2><div class="doc-list">${docs.length?docs.map(d=>`<a href="${d.storage_path||d.url||'#'}" target="_blank" rel="noopener">${d.title||d.document_type||'Documento'} →</a>`).join(''):'<p>Sem documentos disponíveis.</p>'}</div></section>`;document.querySelectorAll('[data-img]').forEach(b=>b.onclick=()=>mainImage.innerHTML=`<img src="${b.dataset.img}" alt="${p.name}">`);add?.addEventListener('click',()=>{let c=JSON.parse(localStorage.getItem('security-cart')||'[]'),r=c.find(x=>String(x.id)===String(p.id));r?r.qty++:c.push({id:p.id,qty:1});localStorage.setItem('security-cart',JSON.stringify(c));add.textContent='Adicionado ✓';setTimeout(()=>add.textContent='Adicionar ao carrinho',1200)})}catch(e){page.innerHTML=`<div class="product-empty"><h1>Produto não disponível</h1><p>${e.message}</p><a class="btn btn-dark" href="category.html">Ver catálogo</a></div>`}})();</script></body></html>
